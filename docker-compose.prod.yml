services:
  plan-postgres:
    image: postgres:16-alpine
    container_name: plan-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novadb}
      TZ: UTC
    volumes:
      - plan_pg_data:/var/lib/postgresql/data
    networks:
      - plan_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  plan-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plan-backend
    restart: always
    depends_on:
      plan-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: '--dns-result-order=ipv4first'
      PORT: 4000
      TZ: ${TZ:-Africa/Addis_Ababa}
      DB_HOST: plan-postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting plan-backend}
      DB_NAME: ${POSTGRES_DB:-novadb}
      DB_DIALECT: postgres
      FRONTEND_URL: https://${DOMAIN}
      APP_NAME: NovaCure Platform
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 chars) before starting plan-backend}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-#Admin2026}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - plan_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  plan-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_FILE_URL: https://${DOMAIN}
        NEXT_PUBLIC_FRONTEND_URL: https://${DOMAIN}
        NEXT_PUBLIC_APP_NAME: NovaCure Platform
    container_name: plan-frontend
    restart: always
    depends_on:
      plan-backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_BASE_URL: https://${DOMAIN}/api
      NEXT_PUBLIC_FILE_URL: https://${DOMAIN}
      NEXT_PUBLIC_FRONTEND_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_NAME: NovaCure Platform
      INTERNAL_API_URL: http://plan-backend:4000/api
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before starting plan-frontend}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET before starting plan-frontend}
      NEXTAUTH_URL: https://${DOMAIN}/api/auth
      NEXTAUTH_URL_INTERNAL: http://127.0.0.1:3000/api/auth
      AUTH_TRUST_HOST: "true"
    networks:
      - plan_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  plan-nginx:
    image: nginx:1.27-alpine
    container_name: plan-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    command: /bin/sh /start.sh
    volumes:
      - ./nginx/start.sh:/start.sh
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/templates/.htpasswd
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/snippets:/etc/nginx/snippets
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - plan-frontend
      - plan-backend
    networks:
      - plan_network

  plan-certbot:
    image: certbot/certbot
    container_name: plan-certbot
    environment:
      - CERTBOT_DOMAIN=${DOMAIN:-plan.system.com.et}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-momsystemsupport@gmail.com}
    volumes:
      - ./nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh /certbot-entrypoint.sh
    networks:
      - plan_network

volumes:
  plan_pg_data:

networks:
  plan_network:
    driver: bridge
