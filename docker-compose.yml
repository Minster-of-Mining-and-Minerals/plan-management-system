services:
  plan-postgres:
    image: postgres:16-alpine
    container_name: plan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novadb}
    ports:
      - "5432:5432"
    volumes:
      - plan_pg_data:/var/lib/postgresql/data
      - ./database/01-restore-db.sh:/docker-entrypoint-initdb.d/01-restore-db.sh:ro
      - ./database.zip:/tmp/database.zip:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  plan-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plan-backend
    restart: unless-stopped
    depends_on:
      plan-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: ${TZ:-Africa/Addis_Ababa}
      DB_HOST: plan-postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting plan-backend}
      DB_NAME: ${POSTGRES_DB:-novadb}
      DB_DIALECT: postgres
      RUN_DB_MIGRATIONS: "true"
      RUN_COLLABORATION_MIGRATIONS: "false"
      RUN_DB_SEEDERS: "false"
      FRONTEND_URL: ${FRONTEND_URL:-https://plan.system.com.et}
      APP_NAME: NovaCure Platform
      # Required in production (≥32 chars). Set in shell or .env beside compose.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (≥32 chars) before starting plan-backend}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  plan-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: https://plan.system.com.et/api
        NEXT_PUBLIC_FILE_URL: https://plan.system.com.et
        NEXT_PUBLIC_FRONTEND_URL: https://plan.system.com.et
        NEXT_PUBLIC_APP_NAME: NovaCure Platform
    container_name: plan-frontend
    restart: unless-stopped
    depends_on:
      plan-backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_BASE_URL: https://plan.system.com.et/api
      NEXT_PUBLIC_FILE_URL: https://plan.system.com.et
      NEXT_PUBLIC_FRONTEND_URL: https://plan.system.com.et
      NEXT_PUBLIC_APP_NAME: NovaCure Platform
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before starting plan-frontend}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET before starting plan-frontend}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  plan-nginx:
    image: nginx:1.27-alpine
    container_name: plan-nginx
    restart: unless-stopped
    depends_on:
      plan-backend:
        condition: service_healthy
      plan-frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  plan_pg_data:
