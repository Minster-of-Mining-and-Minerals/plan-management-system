# Plan Management System — Docker Compose
#
# Local (via Nginx reverse proxy — mirrors production):
#   cp .env.example .env
#   docker compose up -d --build
#   App:        http://localhost
#   API:        http://localhost/api
#   Documents:  http://localhost/api/v1/documents  (collaboration, integrated in backend)
#   ONLYOFFICE: http://localhost/onlyoffice
#   Swagger:    http://localhost/api-docs
#
# Local (direct ports — matches npm run dev layout, no Nginx):
#   docker compose -f docker-compose.yml -f docker-compose.direct.yml up -d --build --scale nginx=0
#   Frontend:   http://localhost:3000
#   API:        http://localhost:4000/api
#   ONLYOFFICE: http://localhost:8080
#
# Production:
#   Set APP_URL, AUTH_URL, APP_DOMAIN, ONLYOFFICE_URL, and TLS certs (see nginx/ssl/README.md)
#   docker compose up -d --build

name: plan-management-system

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-plan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plan_password}
      POSTGRES_DB: ${DB_NAME:-plan_management}
      TZ: UTC
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      # Data lands in /var/lib/postgresql/18/docker inside the volume.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-collaboration-db.sh:/docker-entrypoint-initdb.d/01-init-collaboration-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: mom-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-false}
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice-jwt-secret}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthcheck | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TZ: UTC
      DB_HOST: db
      DB_PORT: 5432
      DB_DIALECT: postgres
      DB_USERNAME: ${DB_USERNAME:-plan_user}
      DB_PASSWORD: ${DB_PASSWORD:-plan_password}
      DB_NAME: ${DB_NAME:-plan_management}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_ACQUIRE: ${DB_POOL_ACQUIRE:-30000}
      DB_POOL_IDLE: ${DB_POOL_IDLE:-10000}
      ENABLE_DASHBOARD_METRICS: ${ENABLE_DASHBOARD_METRICS:-true}
      PORT: 4000
      HOST: 0.0.0.0
      SOCKET_PORT: 5000
      SOCKET_HOST: 0.0.0.0
      TRUST_PROXY: ${TRUST_PROXY:-true}
      APP_URL: ${APP_URL:-http://localhost}
      AUTH_URL: ${AUTH_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BASE_URL: ${BASE_URL:-http://localhost}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost/api}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Addis_Ababa}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      RUN_COLLABORATION_MIGRATIONS: ${RUN_COLLABORATION_MIGRATIONS:-true}
      RUN_DB_SEEDERS: ${RUN_DB_SEEDERS:-false}
      # Collaboration (integrated at /api/v1 — separate DB, shared JWT)
      COLLABORATION_DB_HOST: db
      COLLABORATION_DB_PORT: 5432
      COLLABORATION_DB_USERNAME: ${DB_USERNAME:-plan_user}
      COLLABORATION_DB_PASSWORD: ${DB_PASSWORD:-plan_password}
      COLLABORATION_DB_NAME: ${COLLABORATION_DB_NAME:-collaboration_service}
      COLLABORATION_PUBLIC_URL: ${COLLABORATION_PUBLIC_URL:-http://backend:4000}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://localhost/onlyoffice}
      ONLYOFFICE_JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-false}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice-jwt-secret}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-collaboration-file-token-secret}
      FILE_TOKEN_TTL_SECONDS: ${FILE_TOKEN_TTL_SECONDS:-3600}
      DOCUMENT_STORAGE_PATH: /collaboration-service/storage/documents
    volumes:
      - backend_uploads:/app/uploads
      - backend_public_uploads:/app/public/uploads
      - collaboration_documents:/collaboration-service/storage/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost/api}
        NEXT_PUBLIC_FILE_URL: ${NEXT_PUBLIC_FILE_URL:-http://localhost}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost}
        NEXT_PUBLIC_SOCKET_PORT: ${NEXT_PUBLIC_SOCKET_PORT:-5000}
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
        NEXT_PUBLIC_DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-nginx}
        NEXT_PUBLIC_COLLABORATION_API_URL: ${NEXT_PUBLIC_COLLABORATION_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL:-http://localhost/onlyoffice}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost}
      NEXTAUTH_URL: ${AUTH_URL:-http://localhost}
      AUTH_TRUST_HOST: "true"
      INTERNAL_API_URL: http://backend:4000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

volumes:
  postgres_data:
  backend_uploads:
  backend_public_uploads:
  collaboration_documents:
  onlyoffice_data:
  onlyoffice_logs:

networks:
  app-network:
    driver: bridge
