# Plan Management System — reverse-proxy routes
#
# Nginx mode (default docker compose):
#   http://localhost/              -> frontend (Next.js)
#   http://localhost/api/          -> backend (Express)
#   http://localhost/api/auth/*    -> split: backend login/me + NextAuth session routes
#   http://localhost/socket.io/    -> backend Socket.IO
#   http://localhost/uploads/      -> backend static uploads
#   http://localhost/api-docs      -> Swagger UI
#
# Upstreams: frontend:3000, backend:4000, backend:5000 (see 00-upstreams.conf)

server {
    listen 80;
    server_name localhost 127.0.0.1;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-locations.conf;
}

# Catch-all for IP / unknown Host headers (LAN, VM, load balancer health checks)
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
