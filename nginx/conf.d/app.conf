# NovaCure Platform — reverse proxy (HTTP)
#
# Public entry (via Nginx on :80):
#   http://localhost
#   http://<your-production-domain>
#
# Routes:
#   /             -> Next.js frontend (web:3000)
#   /api/         -> Express API (api:4000), except NextAuth under /api/auth/*
#   /api/auth/*   -> NextAuth (web:3000) — session, csrf, callback, providers
#   /socket.io/   -> Socket.IO (api:5000)
#   /uploads/     -> API static uploads (api:4000)
#   /api-docs     -> Swagger UI (api:4000)
#
# Frontend build env when using this proxy (not :3000/:4000 directly):
#   NEXT_PUBLIC_BASE_URL=http://<host>/api
#   NEXT_PUBLIC_FILE_URL=http://<host>
#   NEXT_PUBLIC_FRONTEND_URL=http://<host>
#   FRONTEND_URL=http://<host>   (backend CORS)
#
# Direct port access (docker-compose without nginx):
#   :3000 frontend, :4000 API, :5000 Socket.IO

server {
    listen 80;
    server_name localhost;

    # Add your production hostname(s) here, e.g.:
    # server_name novacure.example.com localhost;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-locations.conf;
}

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
