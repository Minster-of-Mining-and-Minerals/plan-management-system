# Shared reverse-proxy routes — included by HTTP and HTTPS server blocks.
# Upstreams: novacure_web, novacure_api (conf.d/00-upstreams.conf)

# Socket.IO shares the API HTTP server (port 4000)
location /socket.io/ {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-websocket.conf;
}

# Uploaded files and attachments (100MB limit set in nginx.conf)
location /uploads/ {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
    client_max_body_size 100m;
    expires 7d;
    add_header Cache-Control "public";
}

# Backend auth API — exact paths must win over the NextAuth /api/auth/ prefix below.
# (^~ /api/auth/ would otherwise swallow /me and /permissions and return 400 from Next.js)
location = /api/auth/login {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /api/auth/me {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /api/auth/permissions {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /api/auth/logout {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location ^~ /api/auth/forgot-password {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# NextAuth session routes (session, csrf, callback, providers, signin, …)
location ^~ /api/auth/ {
    proxy_pass http://novacure_web;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Express REST API (patients, workflow, prescriptions, clinical-suggestions, …)
location ^~ /api/ {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
    client_max_body_size 100m;
}

# Swagger API docs
location ^~ /api-docs {
    proxy_pass http://novacure_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Next.js static assets
location /_next/static/ {
    proxy_pass http://novacure_web;
    include /etc/nginx/snippets/proxy-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /_next/image {
    proxy_pass http://novacure_web;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Next.js application (App Router + i18n)
location / {
    proxy_pass http://novacure_web;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
