# Shared reverse-proxy routes — included by HTTP and HTTPS server blocks.
# Plan Management System (Next.js + Express + Socket.IO)

# Let's Encrypt HTTP-01 challenge (certbot --webroot writes to nginx/certbot-www on the host)
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

# Socket.IO (proxied to backend:5000)
location /socket.io/ {
    proxy_pass http://backend_socket;
    include /etc/nginx/snippets/proxy-websocket.conf;
}

# Uploaded files (100MB limit set in nginx.conf)
location /uploads/ {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
    client_max_body_size 100m;
    expires 7d;
    add_header Cache-Control "public";
}

# Backend auth API — exact paths must win over the NextAuth /api/auth/ prefix below.
location = /api/auth/login {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /api/auth/me {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /api/auth/permissions {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location = /api/auth/logout {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location ^~ /api/auth/forgot-password {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# NextAuth session routes (session, csrf, callback, providers, signin, …)
location ^~ /api/auth/ {
    proxy_pass http://frontend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Backend REST API (/api/plan, /api/users, /api/v1/documents, …)
location ^~ /api/ {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
    client_max_body_size 100m;
}

# ONLYOFFICE Document Server (browser editor UI + co-editing WebSockets)
location /onlyoffice/ {
    proxy_pass http://onlyoffice_app/;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/onlyoffice-proxy.conf;
}

# Swagger API docs
location ^~ /api-docs {
    proxy_pass http://backend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Next.js static assets
location /_next/static/ {
    proxy_pass http://frontend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /_next/image {
    proxy_pass http://frontend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Frontend application (Next.js App Router + i18n)
location / {
    proxy_pass http://frontend_app;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
