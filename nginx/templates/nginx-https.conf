server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    location = /health {
        auth_basic off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl default_server;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Basic Authentication for the entire application (can be overridden in specific locations)
    auth_basic "NovaCure Platform - Restricted Access";
    auth_basic_user_file /etc/nginx/templates/.htpasswd;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location = /health {
        auth_basic off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Include existing security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Include existing application routes
    include /etc/nginx/snippets/app-locations.conf;
}
