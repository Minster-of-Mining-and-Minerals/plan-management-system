server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 200 'SSL certificate is being set up. Please wait and refresh in a minute...';
        add_header Content-Type text/plain;
    }

    location = /health {
        auth_basic off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
